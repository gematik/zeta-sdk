  <<: *nuget-rules
  needs:
    - job: build-sdk-windows
      artifacts: true
  before_script:
    - dotnet --info
  script:
    - '$NUGET_VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:RELEASE_VERSION_WEB }'
    - 'if (-not $NUGET_VERSION -or $NUGET_VERSION -eq "latest") { throw "A valid NuGet version must be provided" }'
    - Write-Host "NuGet version $NUGET_VERSION"
    - New-Item -ItemType Directory -Force -Path zeta-csharp-nuget/runtimes/win-x64/native | Out-Null
    - Copy-Item zeta-sdk/build/bin/mingwX64/releaseShared/zeta_sdk.dll zeta-csharp-nuget/runtimes/win-x64/native/zeta_sdk.dll
    - dotnet pack zeta-csharp-nuget/ZetaSdk.csproj --configuration Release --output "$env:CI_PROJECT_DIR/nupkg-windows" -p:PackageVersion="$NUGET_VERSION" -p:ZetaRid=win-x64
    - Get-ChildItem nupkg-windows
  artifacts:
    expire_in: 1 week
    paths:
