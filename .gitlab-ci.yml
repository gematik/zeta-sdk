    - cp zeta-sdk/build/bin/linuxX64/releaseShared/libzeta_sdk.so zeta-csharp-nuget/runtimes/linux-x64/native/libzeta_sdk.so
    - NUGET_VERSION="${CI_COMMIT_TAG:-$RELEASE_VERSION_WEB}"
    - 'if [ -z "$NUGET_VERSION" ] || [ "$NUGET_VERSION" = "latest" ]; then echo "A valid NuGet version must be provided"; exit 1; fi'
    - echo "NuGet version $NUGET_VERSION"
    - dotnet pack zeta-csharp-nuget/ZetaSdk.csproj --configuration Release --output "$CI_PROJECT_DIR/nupkg-linux" -p:PackageVersion="$NUGET_VERSION" -p:ZetaRid=linux-x64
