spec:
  inputs:
    do_dependency_scan:
      description: "Run the dependency-scan-gradle job"
      type: boolean
      default: false
    do_image_build:
      description: "Build the container images (auto on develop, staging, release branches)"
      type: boolean
      default: false
    sonar-quality-gate-enabled:
      description: 'Enables SonarQube [Quality Gate](https://docs.sonarsource.com/sonarqube-server/latest/quality-standards-administration/managing-quality-gates/introduction/) verification, except in "develop" branch and "latest" tags.'
      type: boolean
      default: true
    do_dependency_updates_check:
      description: 'Run Ben Manes dependency update report'
      type: boolean
      default: true
    do_pre_release_checks:
      description: "Run pre-release checks: client build + tests (C#, Java) and dependency scan. Automatically enabled when merging to or pushing on staging/release."
      type: boolean
      default: false
    do_client_tests_only:
      description: "Fast lane: run ONLY the client build+test jobs (C#, Java), skipping all other stages"
      type: boolean
      default: false
    do_nuget_only:
      description: "Fast lane: build, test and publish only the C# NuGet package"
      type: boolean
      default: false
    do_sbom_csharp_only:
      description: "Fast lane: generate and publish only the C# SBOM"
      type: boolean
      default: false
    android:
      description: "Android TestDriver [Full]: APK+ Image + HelloZeta. [test-only]:run hellozeta-android. [base-image]: rebuild the emulator base image and runs [full]"
      type: string
      default: "off"
      options: [ "off", "full", "test-only", "base-image"]
    browserstack:
      description: "Build signed APK/IPA and upload them to BrowserStack. [android] / [ios] / [all]"
      type: string
      default: "off"
      options: [ "off", "android", "ios", "all" ]

---

variables:
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle-home"
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  RELEASE_VERSION_WEB:
    value: latest
    description: "The version of the new release, e.g.:  x.y.z - default tag latest (input from web interface)"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  DOCKER_TLS_VERIFY: "1"
  ANDROID_EMULATOR_IMAGE: "$CI_REGISTRY_IMAGE/android-emulator-image:latest"
  ANDROIDTESTDRIVER_IMAGE: "$CI_REGISTRY_IMAGE/android-testdriver-image"
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle

include:
  # adds job dependency-check-gradle
  - component: $CI_SERVER_FQDN/zeta/zeta-ci-cd-components/dependency-check-gradle@v1.2.2
    inputs:
      cli-bin: ./gradlew
      job-stage: testAndAnalysis
      image: "$CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk"
      cache-key: zeta-sdk-dependency-check

workflow:
  rules:
    # basically disables RELEASE_VERSION_WEB. Build results get tagged with a version only if running on a git tag
    - if: '$RELEASE_VERSION_WEB != "latest" && $CI_COMMIT_TAG == null && "$[[ inputs.do_nuget_only ]]" != "true" && "$[[ inputs.do_sbom_csharp_only ]]" != "true"'
      when: never
    # check new commits on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # web-based requests
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION_WEB != null && $RELEASE_VERSION_WEB != ""'
    # auto-build branch tags on merge
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    # auto-build for tags
    - if: $CI_COMMIT_TAG != null
    - when: never

default:
  image: $CI_REGISTRY/zeta/zeta-client/zeta-sdk/android-image:latest
  tags: [ zeta ]
  before_script:
    - chmod +x ./gradlew
  cache:
    # cache valid only for a specific pipeline instance
    - key: $CI_PIPELINE_ID
      paths:
        - "**/build"
        - "**/build/**"
        - "build-cache"
    # Gradle dependencies + wrapper, shared across pipelines
    - key:
        files:
          - gradle/libs.versions.toml
          - gradle/wrapper/gradle-wrapper.properties
      paths:
        - .gradle-home/caches/modules-2/
        - .gradle-home/wrapper/
  services:
    - name: docker:24.0.5-dind
      variables:
        HEALTHCHECK_TCP_PORT: "2376"

stages:
  - testAndAnalysis
  - build
  - native_build
  - client_tests
  - nuget
  - publish
  - image_build
  - android_tests
  - browserstack
  - container_scan
  - report

.skip-if-sbom-csharp-only: &skip-if-sbom-csharp-only
  - if: '"$[[ inputs.do_sbom_csharp_only ]]" == "true"'
    when: never

.sbom-csharp-rules: &sbom-csharp-rules
  rules:
    - if: '$CI_COMMIT_TAG != null'
    - if: '"$[[ inputs.do_sbom_csharp_only ]]" == "true"'
    - if: '"$[[ inputs.do_nuget_only ]]" == "true"'
    - when: never

# Fast-lane skip: when do_nuget_only is set, every non-NuGet job is disabled.
.skip-if-nuget-only: &skip-if-nuget-only
  - if: '"$[[ inputs.do_nuget_only ]]" == "true"'
    when: never

# Fast-lane skip: when do_client_tests_only is set, every non-client-test job is disabled,
# regardless of any other condition. This must be the FIRST rule wherever it's included.
.skip-if-client-tests-only: &skip-if-client-tests-only
  - if: '"$[[ inputs.do_client_tests_only ]]" == "true"'
    when: never

# Fast-lane skip: any android mode (full, test-only, base-image) runs ONLY the android jobs.
.skip-if-android-test-only: &skip-if-android-test-only
  - if: '"$[[ inputs.android ]]" != "off"'
    when: never

# Fast-lane skip: browserstack != off runs ONLY the BrowserStack build+upload jobs.
.skip-if-browserstack: &skip-if-browserstack
  - if: '"$[[ inputs.browserstack ]]" != "off"'
    when: never

# Runs on git tags, or when the pipeline is started with android=full|base-image.
.android-rules: &android-rules
  rules:
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - if: $CI_COMMIT_TAG
    - if: '"$[[ inputs.android ]]" == "full" || "$[[ inputs.android ]]" == "base-image"'
    - when: never

.browserstack-android-rules: &browserstack-android-rules
  rules:
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    - if: '"$[[ inputs.browserstack ]]" == "android" || "$[[ inputs.browserstack ]]" == "all"'
    - when: never

.browserstack-ios-rules: &browserstack-ios-rules
  rules:
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    - if: '"$[[ inputs.browserstack ]]" == "ios" || "$[[ inputs.browserstack ]]" == "all"'
    - when: never

# define the release version variable, that determines the tag in the repositories
# this is included (referenced) in the various build stages/jobs
.variables_template: &variables_template
  variables:
    SONAR_QUALITY_GATE_ENABLED: $[[ inputs.sonar-quality-gate-enabled ]]
    RELEASE_VERSION: $RELEASE_VERSION_WEB
  rules:
    - !reference [ .skip-if-browserstack ]
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    # if on a tag, set the release version to the tag
    - if: $CI_COMMIT_TAG != null
      variables:
        RELEASE_VERSION: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "develop-mr-$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_BRANCH == "develop" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "develop"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "staging-mr-$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_BRANCH == "staging" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "staging"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "release-mr-$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_BRANCH == "release" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "release"

.image_template: &image_template
  image: $CI_REGISTRY/zeta/devops/ci-images/docker:24.0.5-zeta-0
  needs: [build]
  <<: *variables_template
  rules:
    - !reference [ .variables_template, rules]
    - if: '"$[[ inputs.do_image_build ]]" == "true"'
    - when: never

.gradle_template: &gradle_template
  <<: *variables_template
  rules:
    - !reference [ .variables_template, rules]
    - when: on_success

.sonar_template: &sonar_template
  extends: .variables_template
  variables:
    GIT_DEPTH: 0
  rules:
    - !reference [ .variables_template, rules ]
    - when: on_success

.pre-release-checks-rules: &pre-release-checks-rules
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '"$[[ inputs.do_pre_release_checks ]]" == "true"'
    - if: '"$[[ inputs.do_client_tests_only ]]" == "true"'

# NuGet jobs (pack, test, publish)
.nuget-rules: &nuget-rules
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '"$[[ inputs.do_nuget_only ]]" == "true"'
    - when: never

# gradle jobs

check-copyright:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    - chmod +x scripts/check-copyright.sh
    - ./scripts/check-copyright.sh .

test:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    - echo "value of RUNNING_ON_CI is -$RUNNING_ON_CI-"
    - echo "value of TF_BUILD is -$TF_BUILD-"
    - echo "value of CI is -$CI-"
    - echo "value of RELEASE_VERSION is -$RELEASE_VERSION-"
    - echo "value of RELEASE_VERSION_WEB is -$RELEASE_VERSION_WEB-"
    - echo "value of SONAR_QUALITY_GATE_ENABLED is -$SONAR_QUALITY_GATE_ENABLED-"
    - echo "value of CI_COMMIT_REF_NAME is -$CI_COMMIT_REF_NAME-"
    - echo "value of CI_MERGE_REQUEST_TARGET_BRANCH_NAME is -$CI_MERGE_REQUEST_TARGET_BRANCH_NAME-"
    # store in .m2 for sonar/kover to pick up for Java client
    - ./gradlew publishJvmPublicationToMavenLocal publishKotlinMultiplatformPublicationToMavenLocal
    # check for local .m2 repo content and build cache
    - find / -name build-cache 2>/dev/null || true
    - find /root/.m2 -name \*.pom 2>/dev/null || true
    # tests, analysis
    - ./gradlew testAll :koverXmlReport koverLog
    # show result files
    - find /builds -name \*.xml 2>/dev/null
  artifacts:
    when: always
    paths:
      - "**/report.xml"
      - "**/coverage.txt"
    reports:
      coverage_report:
        coverage_format: jacoco
        path: "**/report.xml"

lint:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    # lintDebug is required to create the output for sonar
    - ./gradlew ktLint lintDebug
  allow_failure: true
  artifacts:
    when: always
    paths:
      - "**/ktlint.xml"
      - "**/lint-results-debug.html"
      - "**/lint-results-debug.xml"

detekt:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    - ./gradlew detekt
  allow_failure: true
  artifacts:
    when: always
    paths:
      - "**/detekt.html"
      - "**/detekt.xml"

sonar:
  <<: *sonar_template
  stage: testAndAnalysis
  needs:
    - job: test
      artifacts: true
    - job: lint
      artifacts: true
    - job: detekt
      artifacts: true
    - job: dependency-check-gradle
      artifacts: true
      optional: true
  script:
    # store in .m2 for sonar/kover to pick up for Java client
    - ./gradlew publishJvmPublicationToMavenLocal publishKotlinMultiplatformPublicationToMavenLocal
    # check for local .m2 repo content and build cache
    - find / -name build-cache 2>/dev/null || true
    - find /root/.m2 -name \*.pom 2>/dev/null
    - >-
      ./gradlew
      sonar ${TRACE+-Dsonar.verbose=true} ${SONAR_QUALITY_GATE_ENABLED+-Dsonar.qualitygate.wait=$SONAR_QUALITY_GATE_ENABLED}
      -Dsonar.links.homepage=${CI_PROJECT_URL}
      -Dsonar.links.ci=${CI_PROJECT_URL}/-/pipelines
      -Dsonar.links.issue=${CI_PROJECT_URL}/-/issues
      -Dsonar.exclusions=ktor-client-curl/**
  artifacts:
    when: always
    paths:
      - "**/problems-report.html"

dependency-updates:
  <<: *gradle_template
  stage: testAndAnalysis
  rules:
    - !reference [ .skip-if-browserstack ]
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    - if: '"$[[ inputs.do_dependency_updates_check ]]" == "true"'
      when: on_success
    - when: never
  script:
    - ./gradlew dependencyUpdates --no-parallel
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "**/build/dependencyUpdates/report.txt"
      - "**/build/dependencyUpdates/report.json"

dependency-check-gradle:
  rules:
    - !reference [ .skip-if-browserstack ]
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    - if: '"$[[ inputs.do_dependency_scan ]]" == "true"'
      when: on_success
    - !reference [ .pre-release-checks-rules, rules ]
    - when: never

build:
  <<: *gradle_template
  stage: build
  script:
    - ./gradlew assemblePullRequest

test-linux-shared-lib:
  stage: build
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  rules:
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
  script:
    - apt-get update && apt-get install -y libunistring-dev
    - ./gradlew :zeta-sdk:linkReleaseSharedLinuxX64
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - "zeta-sdk/build/bin/linuxX64/releaseShared/*"

build_dokka:
  <<: *gradle_template
  stage: build
  script:
    - ./gradlew dokkaGeneratePublicationHtml
  artifacts:
    when: always
    paths:
      - "**/dokka"
      - "**/dokka-module"
sbom:
  <<: *gradle_template
  stage: build
  script:
    - ./gradlew cyclonedxDirectBom --info
    - ./gradlew cyclonedxBom
  artifacts:
    when: always
    paths:
      - "**/build/reports/cyclonedx-direct/bom.json"
      - "**/build/reports/cyclonedx-direct/bom.xml"
      - "**/build/reports/cyclonedx/bom.json"
      - "**/build/reports/cyclonedx/bom.xml"

build-android-emulator-image:
  stage: build
  image: $CI_REGISTRY/zeta/devops/ci-images/docker:24.0.5-zeta-0
  needs: []
  cache: []
  rules:
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - if: '"$[[ inputs.android ]]" == "base-image"'
    - when: never
  script:
    - printf "%s" "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
    - printf "%s" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build
      --build-arg BASE_IMAGE="$CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/budtmo/docker-android:emulator_14.0"
      -t "$ANDROID_EMULATOR_IMAGE" - < Dockerfile.android-emulator
    - docker push "$ANDROID_EMULATOR_IMAGE"

build-android-testdriver-image:
  <<: *android-rules
  stage: image_build
  image: $CI_REGISTRY/zeta/devops/ci-images/docker:24.0.5-zeta-0
  cache: []
  needs:
    - job: android-testdriver-apk
    - job: build-android-emulator-image
      optional: true
  script:
    - printf "%s" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build
      --build-arg BASE_IMAGE="$ANDROID_EMULATOR_IMAGE"
      -t "$ANDROIDTESTDRIVER_IMAGE:$CI_COMMIT_SHORT_SHA"
      -f Dockerfile.android-testdriver .
    - docker push "$ANDROIDTESTDRIVER_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      for t in "$CI_COMMIT_REF_SLUG" ${CI_COMMIT_TAG:+"$CI_COMMIT_TAG"}; do
        docker tag "$ANDROIDTESTDRIVER_IMAGE:$CI_COMMIT_SHORT_SHA" "$ANDROIDTESTDRIVER_IMAGE:$t"
        docker push "$ANDROIDTESTDRIVER_IMAGE:$t"
      done

hellozeta-android:
  stage: android_tests
  allow_failure: true
  image:
    name: $ANDROIDTESTDRIVER_IMAGE:$ANDROIDTESTDRIVER_TAG
    entrypoint: [""]
  needs:
    - job: build-android-testdriver-image
      optional: true
  timeout: 20m
  # nothing from the repo or the pipeline cache is needed, and no docker daemon
  services: []
  cache: []
  before_script: []
  variables:
    GIT_STRATEGY: none
  rules:
    - !reference [ .skip-if-nuget-only ]
    - !reference [ .skip-if-client-tests-only ]
    - !reference [ .skip-if-sbom-csharp-only ]
    - if: '"$[[ inputs.android ]]" == "test-only"'
      variables:
        ANDROIDTESTDRIVER_TAG: $CI_COMMIT_REF_SLUG
    - if: $CI_COMMIT_TAG
      variables:
        ANDROIDTESTDRIVER_TAG: $CI_COMMIT_SHORT_SHA
    - if: '"$[[ inputs.android ]]" == "full" || "$[[ inputs.android ]]" == "base-image"'
      variables:
        ANDROIDTESTDRIVER_TAG: $CI_COMMIT_SHORT_SHA
    - when: never
  script:
    - /opt/testdriver/entrypoint.sh > entrypoint.log 2>&1 &
    - ENTRYPOINT_PID=$!
    - |
      for i in $(seq 1 60); do
        wget -qO- http://localhost:8080/androiddriver-api/health && break
        kill -0 "$ENTRYPOINT_PID" 2>/dev/null || { echo "entrypoint exited early:"; cat entrypoint.log; exit 1; }
        [ "$i" = 60 ] && { echo "android-testdriver not ready after 5 min"; exit 1; }
        echo "waiting for android-testdriver... ($(tail -n 1 entrypoint.log 2>/dev/null))"; sleep 5
      done
    - wget -S --content-on-error --tries=1 --timeout=120 -O- http://localhost:8080/androidproxy/hellozeta
  after_script:
    - cat entrypoint.log || true

android-testdriver-apk:
  <<: *android-rules
  stage: build
  needs: []
  services: []
  script:
    - ./gradlew :zeta-android-testdriver:assembleDebug
  artifacts:
    expire_in: 1 week
    paths:
      - zeta-android-testdriver/build/outputs/apk/debug/zeta-android-testdriver-debug.apk

browserstack-android-apk:
  <<: *browserstack-android-rules
  stage: build
  needs: []
  services: []
  before_script:
    - mkdir -p zeta-client/src/androidMain/assets
    - cp "$ZETA_ENV" zeta-client/src/androidMain/assets/zeta.env
  script:
    - ./gradlew :zeta-client:assembleRelease
    - echo "$ANDROID_RELEASE_KEYSTORE_B64" | base64 -d > /tmp/release.jks
    - SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$(grep -s '^sdk.dir=' local.properties | cut -d= -f2)}}"
    - APKSIGNER=$(ls "$SDK"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
    - '[ -n "$APKSIGNER" ] || APKSIGNER=$(find / -path "*/build-tools/*/apksigner" -type f 2>/dev/null | sort -V | tail -1)'
    - echo "using $APKSIGNER"
    - >-
      "$APKSIGNER" sign
      --ks /tmp/release.jks --ks-type JKS
      --ks-pass env:ANDROID_RELEASE_KEYSTORE_PASS
      --ks-key-alias "$ANDROID_RELEASE_KEY_ALIAS"
      --out app-browserstack.apk
      zeta-client/build/outputs/apk/release/zeta-client-release-unsigned.apk
    - '"$APKSIGNER" verify --print-certs app-browserstack.apk'
  after_script:
    - rm -f /tmp/release.jks
  artifacts:
    expire_in: 1 week
    paths:
      - app-browserstack.apk

browserstack-android-upload:
  <<: *browserstack-android-rules
  stage: browserstack
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  needs:
    - job: browserstack-android-apk
      artifacts: true
  services: []
  cache: []
  before_script:
    - command -v jq || (apt-get update && apt-get install -y jq)
  script:
    - |
      RESPONSE=$(curl -sS --fail-with-body -u "${BS_USER}:${BS_KEY}" \
        -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
        -F "file=@app-browserstack.apk" \
        -F "custom_id=ZetaClientAndroid")
      echo "$RESPONSE"
      APP_URL=$(echo "$RESPONSE" | jq -r '.app_url // empty')
      [ -n "$APP_URL" ] || { echo "BrowserStack upload failed"; exit 1; }
      echo "BS_APP_URL=${APP_URL}" > browserstack.env
      echo "Uploaded: ${APP_URL}"
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: browserstack.env

browserstack-ios-ipa:
  <<: *browserstack-ios-rules
  stage: build
  tags:
    - attestation-vm-macos
  needs: []
  cache: []
  variables:
    IOS_PROJECT: "iosApp/iosApp.xcodeproj"
    IOS_SCHEME: "iosApp"
    IOS_EXPORT_METHOD: "enterprise"
  before_script:
    - cp "$ZETA_ENV" iosApp/iosApp/zeta.env
    - chmod +x ./gradlew
    - chmod +x ./scripts/ios-signing-setup.sh
    - chmod +x ./scripts/build-ios-ipa.sh
    - chmod +x ./scripts/ios-signing-cleanup.sh
  script:
    - |
      set -euo pipefail

      CONSOLE_UID="$(id -u customer)"

      # GitLab checked out the repository as root.
      # The iOS build must run as customer for macOS code signing.
      chown -R customer:staff "$CI_PROJECT_DIR"

      launchctl asuser "$CONSOLE_UID" \
        sudo -H -u customer \
        env \
          CI_JOB_ID="$CI_JOB_ID" \
          CI_PROJECT_DIR="$CI_PROJECT_DIR" \
          IOS_CERT_P12_B64="$IOS_CERT_P12_B64" \
          IOS_CERT_PASSWORD="$IOS_CERT_PASSWORD" \
          IOS_PROFILE_B64="$IOS_PROFILE_B64" \
          IOS_PROJECT="$IOS_PROJECT" \
          IOS_SCHEME="$IOS_SCHEME" \
          IOS_EXPORT_METHOD="$IOS_EXPORT_METHOD" \
        bash <<'EOF'
      set -euo pipefail

      cd "$CI_PROJECT_DIR"

      echo "=== Build context ==="
      whoami
      echo "HOME=$HOME"

      echo "=== Setup signing ==="
      ./scripts/ios-signing-setup.sh

      echo "=== Build IPA ==="
      ./scripts/build-ios-ipa.sh
      EOF
  after_script:
    - |
      CONSOLE_UID="$(id -u customer)"

      launchctl asuser "$CONSOLE_UID" \
        sudo -H -u customer \
        env CI_JOB_ID="$CI_JOB_ID" \
        ./scripts/ios-signing-cleanup.sh || true

      chown -R root:staff "$CI_PROJECT_DIR"
  artifacts:
    expire_in: 1 week
    paths:
      - app-browserstack.ipa

browserstack-ios-upload:
  <<: *browserstack-ios-rules
  stage: browserstack
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  needs:
    - job: browserstack-ios-ipa
      artifacts: true
  services: []
  cache: []
  before_script:
    - command -v jq || (apt-get update && apt-get install -y jq)
  script:
    - |
      RESPONSE=$(curl -sS --fail-with-body -u "${BS_USER}:${BS_KEY}" \
        -X POST "https://api-cloud.browserstack.com/app-automate/upload" \
        -F "file=@app-browserstack.ipa" \
        -F "custom_id=ZetaClientIOS")

      echo "$RESPONSE"

      APP_URL=$(echo "$RESPONSE" | jq -r '.app_url // empty')

      [ -n "$APP_URL" ] || {
        echo "BrowserStack upload failed"
        exit 1
      }

      echo "BS_IOS_APP_URL=${APP_URL}" > browserstack-ios.env
      echo "Uploaded: ${APP_URL}"
  artifacts:
    expire_in: 1 week
    reports:
      dotenv: browserstack-ios.env

build-sdk-linux:
  stage: native_build
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  tags:
    - attestation-vm-linux
  rules:
    - !reference [ .skip-if-sbom-csharp-only ]
    - !reference [ .skip-if-android-test-only ]
    - if: '$CI_COMMIT_TAG'
    - if: '"$[[ inputs.do_nuget_only ]]" == "true"'
    - !reference [ .pre-release-checks-rules, rules ]
    - when: never
  before_script:
    - java -version
    - echo "$SMB_KEYSTORE_FILE_B64" | base64 -d > /tmp/smcb.p12
  script:
    - export SMB_KEYSTORE_FILE=/tmp/smcb.p12
    - apt-get update && apt-get install -y libunistring-dev
    - ./gradlew :zeta-sdk:linkReleaseSharedLinuxX64
  after_script:
    # shell executor: stop Gradle daemons so they don't accumulate memory between jobs
    - ./gradlew --stop || true
  artifacts:
    expire_in: 1 week
    paths:
      - "zeta-sdk/build/bin/linuxX64/releaseShared/*"

build-sdk-windows:
  stage: native_build
  tags:
