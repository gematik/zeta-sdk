spec:
  inputs:
    do_dependency_scan:
      description: "Run the dependency-scan-gradle job"
      type: boolean
      default: false
    do_image_build:
      description: "Build the container images (auto on develop, staging, release branches)"
      type: boolean
      default: false
    sonar-quality-gate-enabled:
      description: 'Enables SonarQube [Quality Gate](https://docs.sonarsource.com/sonarqube-server/latest/quality-standards-administration/managing-quality-gates/introduction/) verification, except in "develop" branch and "latest" tags.'
      type: boolean
      default: true
    do_dependency_updates_check:
      description: 'Run Ben Manes dependency update report'
      type: boolean
      default: true
    do_pre_release_checks:
      description: "Run pre-release checks: client build + tests (C#, Java) and dependency scan. Automatically enabled when merging to or pushing on staging/release."
      type: boolean
      default: false
    do_client_tests_only:
      description: "Fast lane: run ONLY the client build+test jobs (C#, Java), skipping all other stages"
      type: boolean
      default: false

---

variables:
  ANDROID_COMPILE_SDK: "37"
  ANDROID_BUILD_TOOLS: "37.0.0"
  ANDROID_SDK_TOOLS: "11076708"
  RELEASE_VERSION_WEB:
    value: latest
    description: "The version of the new release, e.g.:  x.y.z - default tag latest (input from web interface)"
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_CERT_PATH: $DOCKER_TLS_CERTDIR/client
  DOCKER_TLS_VERIFY: "1"

include:
  # adds job dependency-check-gradle
  - component: $CI_SERVER_FQDN/zeta/zeta-ci-cd-components/dependency-check-gradle@v1.2.2
    inputs:
      cli-bin: ./gradlew
      job-stage: testAndAnalysis
      image: "$CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk"
      cache-key: zeta-sdk-dependency-check

workflow:
  rules:
    # basically disables RELEASE_VERSION_WEB. Build results get tagged with a version only if running on a git tag
    - if: '$RELEASE_VERSION_WEB != "latest" && $CI_COMMIT_TAG == null'
      when: never
    # check new commits on merge requests
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    # web-based requests
    - if: '$CI_PIPELINE_SOURCE == "web" && $RELEASE_VERSION_WEB != null && $RELEASE_VERSION_WEB != ""'
    # auto-build branch tags on merge
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    # auto-build for tags
    - if: $CI_COMMIT_TAG != null
    - when: never

default:
  image: $CI_REGISTRY/zeta/zeta-client/zeta-sdk/android-image:latest
  tags: [ zeta ]
  before_script:
    - chmod +x ./gradlew
  cache:
    # cache valid only for a specific pipeline instance
    key: $CI_PIPELINE_ID
    paths:
      - "**/build"
      - "**/build/**"
      - "build-cache"
  services:
    - name: docker:24.0.5-dind
      variables:
        HEALTHCHECK_TCP_PORT: "2376"

stages:
  - testAndAnalysis
  - build
  - client_tests
  - publish
  - image_build
  - container_scan
  - report

# Fast-lane skip: when do_client_tests_only is set, every non-client-test job is disabled,
# regardless of any other condition. This must be the FIRST rule wherever it's included.
.skip-if-client-tests-only: &skip-if-client-tests-only
  - if: '"$[[ inputs.do_client_tests_only ]]" == "true"'
    when: never

# define the release version variable, that determines the tag in the repositories
# this is included (referenced) in the various build stages/jobs
.variables_template: &variables_template
  variables:
    SONAR_QUALITY_GATE_ENABLED: $[[ inputs.sonar-quality-gate-enabled ]]
    RELEASE_VERSION: $RELEASE_VERSION_WEB
  rules:
    - !reference [ .skip-if-client-tests-only ]
    # if on a tag, set the release version to the tag
    - if: $CI_COMMIT_TAG != null
      variables:
        RELEASE_VERSION: $CI_COMMIT_TAG
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "develop-mr-$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_BRANCH == "develop" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "develop"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "staging-mr-$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_BRANCH == "staging" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "staging"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "release-mr-$CI_COMMIT_SHORT_SHA"
    - if: $CI_COMMIT_BRANCH == "release" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "true"
        RELEASE_VERSION: "release"

.image_template: &image_template
  image: $CI_REGISTRY/zeta/devops/ci-images/docker:24.0.5-zeta-0
  needs: [build]
  <<: *variables_template
  rules:
    - !reference [ .variables_template, rules]
    - if: '"$[[ inputs.do_image_build ]]" == "true"'
    - when: never

.gradle_template: &gradle_template
  <<: *variables_template
  rules:
    - !reference [ .variables_template, rules]
    - when: on_success

.sonar_template: &sonar_template
  extends: .variables_template
  variables:
    SONAR_QUALITY_GATE_ENABLED: !reference [ .variables_template, variables, SONAR_QUALITY_GATE_ENABLED ]
    RELEASE_VERSION: !reference [ .variables_template, variables, RELEASE_VERSION ]
    GIT_DEPTH: 0
  rules:
    - !reference [ .variables_template, rules ]
    - when: on_success

.pre-release-checks-rules: &pre-release-checks-rules
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
    - if: '$CI_COMMIT_BRANCH == "staging"'
    - if: '$CI_COMMIT_BRANCH == "release"'
    - if: '"$[[ inputs.do_pre_release_checks ]]" == "true"'
    - if: '"$[[ inputs.do_client_tests_only ]]" == "true"'

# gradle jobs

test:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    - echo "value of RUNNING_ON_CI is -$RUNNING_ON_CI-"
    - echo "value of TF_BUILD is -$TF_BUILD-"
    - echo "value of CI is -$CI-"
    - echo "value of RELEASE_VERSION is -$RELEASE_VERSION-"
    - echo "value of RELEASE_VERSION_WEB is -$RELEASE_VERSION_WEB-"
    - echo "value of SONAR_QUALITY_GATE_ENABLED is -$SONAR_QUALITY_GATE_ENABLED-"
    - echo "value of CI_COMMIT_REF_NAME is -$CI_COMMIT_REF_NAME-"
    - echo "value of CI_MERGE_REQUEST_TARGET_BRANCH_NAME is -$CI_MERGE_REQUEST_TARGET_BRANCH_NAME-"
    # store in .m2 for sonar/kover to pick up for Java client
    - ./gradlew publishJvmPublicationToMavenLocal publishKotlinMultiplatformPublicationToMavenLocal
    # check for local .m2 repo content and build cache
    - find / -name build-cache 2>/dev/null || true
    - find /root/.m2 -name \*.pom 2>/dev/null || true
    # tests, analysis
    - ./gradlew testAll :koverXmlReport koverLog
    # show result files
    - find /builds -name \*.xml 2>/dev/null
  artifacts:
    when: always
    paths:
      - "**/report.xml"
      - "**/coverage.txt"
    reports:
      coverage_report:
        coverage_format: jacoco
        path: "**/report.xml"

lint:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    # lintDebug is required to create the output for sonar
    - ./gradlew ktLint lintDebug
  allow_failure: true
  artifacts:
    when: always
    paths:
      - "**/ktlint.xml"
      - "**/lint-results-debug.html"
      - "**/lint-results-debug.xml"

detekt:
  <<: *gradle_template
  stage: testAndAnalysis
  script:
    - ./gradlew detekt
  allow_failure: true
  artifacts:
    when: always
    paths:
      - "**/detekt.html"
      - "**/detekt.xml"

sonar:
  <<: *sonar_template
  stage: testAndAnalysis
  needs:
    - job: test
      artifacts: true
    - job: lint
      artifacts: true
    - job: detekt
      artifacts: true
    - job: dependency-check-gradle
      artifacts: true
      optional: true
  script:
    # store in .m2 for sonar/kover to pick up for Java client
    - ./gradlew publishJvmPublicationToMavenLocal publishKotlinMultiplatformPublicationToMavenLocal
    # check for local .m2 repo content and build cache
    - find / -name build-cache 2>/dev/null || true
    - find /root/.m2 -name \*.pom 2>/dev/null
    - >-
      ./gradlew
      sonar ${TRACE+-Dsonar.verbose=true} ${SONAR_QUALITY_GATE_ENABLED+-Dsonar.qualitygate.wait=$SONAR_QUALITY_GATE_ENABLED}
      -Dsonar.links.homepage=${CI_PROJECT_URL}
      -Dsonar.links.ci=${CI_PROJECT_URL}/-/pipelines
      -Dsonar.links.issue=${CI_PROJECT_URL}/-/issues
      -Dsonar.exclusions=ktor-client-curl/**
  artifacts:
    when: always
    paths:
      - "**/problems-report.html"

dependency-updates:
  <<: *gradle_template
  stage: testAndAnalysis
  rules:
    - !reference [ .skip-if-client-tests-only ]
    - if: '"$[[ inputs.do_dependency_updates_check ]]" == "true"'
      when: on_success
    - when: never
  script:
    - ./gradlew dependencyUpdates --no-parallel
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - "**/build/dependencyUpdates/report.txt"
      - "**/build/dependencyUpdates/report.json"

dependency-check-gradle:
  rules:
    - !reference [ .skip-if-client-tests-only ]
    - if: '"$[[ inputs.do_dependency_scan ]]" == "true"'
      when: on_success
    - !reference [ .pre-release-checks-rules, rules ]
    - when: never

build:
  <<: *gradle_template
  stage: build
  script:
    - ./gradlew assemblePullRequest

test-linux-shared-lib:
  stage: build
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging"'
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release"'
  script:
    - apt-get update && apt-get install -y libunistring-dev
    - ./gradlew :zeta-sdk:linkReleaseSharedLinuxX64
  artifacts:
    expire_in: 1 week
    when: always
    paths:
      - "zeta-sdk/build/bin/linuxX64/releaseShared/*"

build_dokka:
  <<: *gradle_template
  stage: build
  script:
    - ./gradlew dokkaGeneratePublicationHtml
  artifacts:
    when: always
    paths:
      - "**/dokka"
      - "**/dokka-module"
sbom:
  <<: *gradle_template
  stage: build
  script:
    - ./gradlew cyclonedxDirectBom --info
    - ./gradlew cyclonedxBom
  artifacts:
    when: always
    paths:
      - "**/build/reports/cyclonedx-direct/bom.json"
      - "**/build/reports/cyclonedx-direct/bom.xml"
      - "**/build/reports/cyclonedx/bom.json"
      - "**/build/reports/cyclonedx/bom.xml"

build-sdk-linux:
  stage: client_tests
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  tags:
    - attestation-vm-linux
  <<: *pre-release-checks-rules
  before_script:
    - java -version
    - echo "$SMB_KEYSTORE_FILE_B64" | base64 -d > /tmp/smcb.p12
  script:
    - export SMB_KEYSTORE_FILE=/tmp/smcb.p12
    - apt-get update && apt-get install -y libunistring-dev
    - ./gradlew :zeta-sdk:linkReleaseSharedLinuxX64
  after_script:
    # shell executor: stop Gradle daemons so they don't accumulate memory between jobs
    - ./gradlew --stop || true
  artifacts:
    expire_in: 1 week
    paths:
      - "zeta-sdk/build/bin/linuxX64/releaseShared/*"

build-sdk-windows:
  stage: client_tests
  tags:
    - attestation-vm-win
  <<: *pre-release-checks-rules
  before_script:
    - java -version
    - New-Item -ItemType Directory -Force -Path "C:\tmp"
    - "[System.Convert]::FromBase64String($env:SMB_KEYSTORE_FILE_B64) | Set-Content -Path 'C:\\tmp\\smcb.p12' -AsByteStream"
  script:
    - $env:SMB_KEYSTORE_FILE = "C:\\tmp\\smcb.p12"
    - .\gradlew.bat :zeta-sdk:linkReleaseSharedMingwX64
  artifacts:
    expire_in: 1 week
    paths:
      - "zeta-sdk/build/bin/mingwX64/releaseShared/*"

