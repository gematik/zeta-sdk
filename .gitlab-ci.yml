    - '$NUGET_VERSION = if ($env:CI_COMMIT_TAG) { $env:CI_COMMIT_TAG } else { $env:RELEASE_VERSION_WEB }'
    - New-Item -ItemType Directory -Force -Path nupkg-windows, nupkg-linux, nupkg-macos | Out-Null
    - dotnet restore zeta-csharp-nuget/sample/sample.csproj --configfile zeta-csharp-nuget/sample/nuget.ci.config --runtime win-x64 --no-cache -p:ZetaSdkPackage=Zeta.Sdk.Windows -p:ZetaSdkVersion="$NUGET_VERSION"
    - dotnet build zeta-csharp-nuget/sample/sample.csproj --no-restore --runtime win-x64 -p:ZetaSdkPackage=Zeta.Sdk.Windows -p:ZetaSdkVersion="$NUGET_VERSION"
    - 'if (-not (Get-ChildItem zeta-csharp-nuget/sample/bin -Recurse -Filter zeta_sdk.dll)) { throw "zeta_sdk.dll not found in sample output" }'
    - '$env:SMB_KEYSTORE_FILE = "C:/tmp/smcb.p12"'
    - dotnet run --project zeta-csharp-nuget/sample/sample.csproj --no-build --runtime win-x64

