publish:
  <<: *gradle_template
  stage: publish
  script:
    - ./gradlew publish
  dependencies:
    - build

publish_artifacts:
  stage: report
  rules:
    - !reference [ .skip-if-client-tests-only ]
    - if: $CI_COMMIT_TAG
      variables:
        COMMIT_MESSAGE: "$CI_COMMIT_TAG"
        COMMIT_TAG: "tag-$CI_COMMIT_TAG-$CI_COMMIT_SHORT_SHA"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      variables:
        COMMIT_MESSAGE: "staging $CI_COMMIT_SHORT_SHA"
        COMMIT_TAG: "staging-$CI_COMMIT_SHORT_SHA"
      when: on_success
    - if: $CI_COMMIT_BRANCH == "release"
      variables:
        COMMIT_MESSAGE: "release $CI_COMMIT_SHORT_SHA"
        COMMIT_TAG: "release-$CI_COMMIT_SHORT_SHA"
      when: on_success
    - when: never
  needs:
    - job: test
      artifacts: true
    - job: lint
      artifacts: true
    - job: detekt
      artifacts: true
    - job: dependency-check-gradle
      artifacts: true
      optional: true
    - job: sbom
      artifacts: true
    - job: container_scan
      artifacts: true
  script:
    - git clone https://zeta-sdk:${REPORTING_TOKEN}@${CI_SERVER_FQDN}/zeta/reporting.git
    - mkdir -p ./reporting/zeta-sdk/
    - rm -rf ./reporting/zeta-sdk/*
    # unit test coverage
    - find . -path ./reporting -prune -o -name 'report.xml' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    - find . -path ./reporting -prune -o -name 'coverage.txt' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    # lint report
    - find . -path ./reporting -prune -o -name 'ktlint.xml' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    - find . -path ./reporting -prune -o -name 'lint-results-debug.xml' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    # detekt report
    - find . -path ./reporting -prune -o -name 'detekt.xml' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    # SBOM
    - find . -path ./reporting -prune -o -name 'bom.json' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    - find . -path ./reporting -prune -o -name 'bom.xml' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    # Container scan
    - find . -path ./reporting -prune -o -name '*gl-container-scanning-report.json' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    # Dependency Check Report
    - find . -path ./reporting -prune -o -name 'dependency-check-report.*' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    - find . -path ./reporting -prune -o -name 'problems-report.*' -exec cp --parents '{}' ./reporting/zeta-sdk/ \;
    - cd reporting
    - git config user.email "ci@${CI_SERVER_FQDN}"
    - git config  user.name "ci"
    - git add .
    - git commit -m "$COMMIT_MESSAGE"
    - git push
    - git tag -a "zeta-sdk-$COMMIT_TAG" -m "zeta-sdk build $COMMIT_MESSAGE"
    - git push origin "zeta-sdk-$COMMIT_TAG"

########################################################################
# image jobs

.build_matrix: &build_matrix
  parallel:
    matrix:
      - PLATFORM: []

.check_matrix: &check_matrix
  parallel:
    matrix:
      - PLATFORM: ["testdriver", "nativedriver"]

build-image:
  <<: *image_template
  <<: *build_matrix
  stage: image_build
  script:
    - printf "%s" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --build-arg DOCKER_HUB="$CI_REGISTRY/zeta/devops/ci-images/mirror" -t "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/"$PLATFORM"-image:$RELEASE_VERSION -f Dockerfile."$PLATFORM" .
    - docker push "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/"$PLATFORM"-image:$RELEASE_VERSION
    - docker tag "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/"$PLATFORM"-image:$RELEASE_VERSION "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/"$PLATFORM"-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA
    - docker push "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/"$PLATFORM"-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA


build-package-testdriver:
  # requires image_template due to the when: never default rule
  <<: *image_template
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  stage: image_build
  script:
    - ./gradlew publishJvmPublicationToMavenLocal
    - ./gradlew publishKotlinMultiplatformPublicationToMavenLocal
    - ./gradlew clean jar copyRuntimeLibs
  artifacts:
    expire_in: 1 week
    paths:
      - "**/build/libs/*.jar"
      - "**/build/runtime-libs/*.jar"

build-image-testdriver:
  <<: *image_template
  stage: image_build
  needs: [build-package-testdriver]
  script:
    - printf "%s" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build --build-arg DOCKER_HUB="$CI_REGISTRY/zeta/devops/ci-images/mirror" -t "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/testdriver-image:$RELEASE_VERSION -f zeta-testdriver/Dockerfile .
    - docker push "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/testdriver-image:$RELEASE_VERSION
    - docker tag "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/testdriver-image:$RELEASE_VERSION "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/testdriver-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA
    - docker push "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/testdriver-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA

build-package-nativetestdriver:
  <<: *image_template
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  stage: image_build
  script:
    - apt-get update && apt-get install -y libunistring-dev
    - ./gradlew :zeta-nativetestdriver:linkReleaseExecutableLinuxX64
  artifacts:
    expire_in: 1 week
    paths:
      - zeta-nativetestdriver/build/bin/linuxX64/releaseExecutable/native-server.kexe

build-image-nativetestdriver:
  <<: *image_template
  stage: image_build
  needs: [build-package-nativetestdriver]
  script:
    - printf "%s" "$CI_DEPENDENCY_PROXY_PASSWORD" | docker login "$CI_DEPENDENCY_PROXY_SERVER" -u "$CI_DEPENDENCY_PROXY_USER" --password-stdin
    - printf "%s" "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
    - docker build -t "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/nativedriver-image:$RELEASE_VERSION -f zeta-nativetestdriver/Dockerfile .
    - docker push "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/nativedriver-image:$RELEASE_VERSION
    - docker tag "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/nativedriver-image:$RELEASE_VERSION "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/nativedriver-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA
    - docker push "$CI_REGISTRY"/zeta/zeta-client/zeta-sdk/nativedriver-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA

trigger_helm:
  stage: image_build
  needs:
    - job: build-image-testdriver
      optional: true
    - job: build-image-nativetestdriver
      optional: true
  rules:
    - !reference [ .skip-if-client-tests-only ]
    # deploy to staging
    - if: '$CI_COMMIT_BRANCH == "develop"'
      variables:
        TESTDRIVER_IMAGE_TAG: "develop"
        NATIVEDRIVER_IMAGE_TAG: "develop"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $RELEASE_VERSION_WEB == "latest"
      when: on_success
      variables:
        TESTDRIVER_IMAGE_TAG: "develop-mr-$CI_COMMIT_SHORT_SHA"
        NATIVEDRIVER_IMAGE_TAG: "develop-mr-$CI_COMMIT_SHORT_SHA"
    - when: never
  trigger:
    project: zeta/devops/zeta-guard-helm
    # for testing, use something different than main
    branch: main
    strategy: depend


container_scan:
  # Enables https://docs.gitlab.com/ee/user/application_security/container_scanning/ (Container Scanning report is available on GitLab EE Ultimate or GitLab.com Gold)
  <<: *check_matrix
  artifacts:
    access: 'developer'
    expire_in: 1 week
    reports:
      container_scanning: "$PLATFORM-gl-container-scanning-report.json"
    paths:
      - "$PLATFORM-gl-container-scanning-report.json"
    when: always
  before_script: [ ]
  cache:
    paths:
      - .trivycache/
  needs:
    - job: build-image
    - job: build-image-testdriver
    - job: build-image-nativetestdriver
  image:
    name: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/aquasec/trivy:0.69.3@sha256:7228e304ae0f610a1fad937baa463598cadac0c2ac4027cc68f3a8b997115689
    entrypoint: [ "" ]
  script:
    - trivy --version
    # update vulnerabilities db
    - time trivy image --download-db-only
    # Builds report and puts it in the default workdir $CI_PROJECT_DIR, so `artifacts:` can take it from there
    - time trivy image --exit-code 0 --format template --template "@/contrib/gitlab.tpl"
      --output "$CI_PROJECT_DIR/$PLATFORM-gl-container-scanning-report.json" "$FULL_IMAGE_NAME"
    # Prints full report
    - time trivy image --exit-code 0 "$FULL_IMAGE_NAME"
    # Fail on medium to critical vulnerabilities
    - time trivy image --exit-code 1 --severity "$SEVERITIES" "$FULL_IMAGE_NAME"
  stage: container_scan
  variables:
    GIT_STRATEGY: "none"
    TRIVY_USERNAME: "$CI_REGISTRY_USER"
    TRIVY_PASSWORD: "$CI_REGISTRY_PASSWORD"
    TRIVY_AUTH_URL: "$CI_REGISTRY"
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
    FULL_IMAGE_NAME: $CI_REGISTRY/zeta/zeta-client/zeta-sdk/$PLATFORM-image:$RELEASE_VERSION-$CI_COMMIT_SHORT_SHA
    # default, esp, when merging to main, fail on these severities.
    # May still pass if allow_failure set to true (only when merging to develop)
    SEVERITIES: "UNKNOWN,MEDIUM,HIGH,CRITICAL"
  rules:
    - !reference [ .skip-if-client-tests-only ]
    # when merging to develop, only warn on trivy failures (for MEDIUM and up)
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "false"
        RELEASE_VERSION: "develop-mr-$CI_COMMIT_SHORT_SHA"
      allow_failure: true
    - if: $CI_COMMIT_BRANCH == "develop" && $RELEASE_VERSION_WEB == "latest"
      variables:
        SONAR_QUALITY_GATE_ENABLED: "false"
        RELEASE_VERSION: "develop"
      allow_failure: true
    # when merging to staging and release, allow medium and even high, as testdriver is only used in
    # test environments and not in production systems
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "staging" && $RELEASE_VERSION_WEB == "latest"
      variables:
        RELEASE_VERSION: "staging-mr-$CI_COMMIT_SHORT_SHA"
        SEVERITIES: "UNKNOWN,CRITICAL"
    - if: $CI_COMMIT_BRANCH == "staging" && $RELEASE_VERSION_WEB == "latest"
      variables:
        RELEASE_VERSION: "staging"
        SEVERITIES: "UNKNOWN,CRITICAL"
    - if: $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "release" && $RELEASE_VERSION_WEB == "latest"
      variables:
        RELEASE_VERSION: "release-mr-$CI_COMMIT_SHORT_SHA"
        SEVERITIES: "UNKNOWN,CRITICAL"
    - if: $CI_COMMIT_BRANCH == "release" && $RELEASE_VERSION_WEB == "latest"
      variables:
        RELEASE_VERSION: "release"
        SEVERITIES: "UNKNOWN,CRITICAL"
    - !reference [ .image_template, rules]

publish_to_dependencytrack:
  stage: publish
  <<: *gradle_template
  needs:
    - job: sbom
      artifacts: true
  script:
    - find . -path ./reporting -prune -o -name 'bom.json';
    - >-
      curl -v -X POST ${DEPENDENCYTRACK_URL}
      -H "Content-Type: multipart/form-data"
      -H "X-API-Key: ${DEPENDENCYTRACK_TOKEN}"
      -F "projectName=zeta-sdk"
      -F "projectVersion=${RELEASE_VERSION}"
      -F "autoCreate=true"
      -F "bom=@build/reports/cyclonedx/bom.json"
