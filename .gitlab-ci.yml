unit-test-csharp-linux:
  stage: testAndAnalysis
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  tags:
    - attestation-vm-linux
  needs: []
  before_script:
    - dotnet --info
  script:
    - dotnet test zeta-client-csharp/tests

unit-test-csharp-windows:
  stage: testAndAnalysis
  tags:
    - attestation-vm-win
  needs: []
  before_script:
    - dotnet --info
  script:
    - dotnet test zeta-client-csharp\tests

client-test-csharp-linux:
  stage: client_tests
  image: $CI_REGISTRY/zeta/devops/ci-images/mirror/eclipse-temurin:21-jdk
  allow_failure: true
  tags:
    - attestation-vm-linux
  <<: *pre-release-checks-rules
  needs:
    - job: build-sdk-linux
      artifacts: true
  before_script:
    - dotnet --info
    - echo "$SMB_KEYSTORE_FILE_B64" | base64 -d > /tmp/smcb.p12
  script:
    - export SMB_KEYSTORE_FILE=/tmp/smcb.p12
    - mkdir -p zeta-client-csharp/runtimes/linux-x64/native
    - cp zeta-sdk/build/bin/linuxX64/releaseShared/libzeta_sdk.so zeta-client-csharp/runtimes/linux-x64/native/libzeta_sdk.so
    - cd zeta-client-csharp/sample
    - dotnet run

client-test-csharp-windows:
  stage: client_tests
  allow_failure: true
  tags:
    - attestation-vm-win
  <<: *pre-release-checks-rules
  needs:
    - job: build-sdk-windows
      artifacts: true
  before_script:
    - dotnet --info
    - New-Item -ItemType Directory -Force -Path "C:\tmp"
    - "[System.Convert]::FromBase64String($env:SMB_KEYSTORE_FILE_B64) | Set-Content -Path 'C:\\tmp\\smcb.p12' -AsByteStream"
  script:
    - $env:SMB_KEYSTORE_FILE = "C:\\tmp\\smcb.p12"
    - New-Item -ItemType Directory -Force -Path "zeta-client-csharp\runtimes\win-x64\native"
    - Copy-Item "zeta-sdk\build\bin\mingwX64\releaseShared\zeta_sdk.dll" -Destination "zeta-client-csharp\runtimes\win-x64\native\zeta_sdk.dll"
    - cd zeta-client-csharp\sample
    - dotnet run

