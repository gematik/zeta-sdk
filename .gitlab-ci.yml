  variables:
    NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget-packages"
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then NUGET_VERSION="$CI_COMMIT_TAG"; else NUGET_VERSION="$RELEASE_VERSION_WEB"; fi
      mkdir -p nupkg-windows nupkg-linux nupkg-macos
      dotnet restore zeta-csharp-nuget/sample/sample.csproj --configfile zeta-csharp-nuget/sample/nuget.ci.config --runtime linux-x64 --no-cache -p:ZetaSdkPackage=Zeta.Sdk.Linux -p:ZetaSdkVersion="$NUGET_VERSION"
