    - find zeta-csharp-nuget/sample/bin -name "libzeta_sdk.dylib" -print | grep .
    - export SMB_KEYSTORE_FILE=/tmp/smcb.p12
    - dotnet run --project zeta-csharp-nuget/sample/sample.csproj --no-build --runtime osx-arm64

